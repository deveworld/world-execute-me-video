<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="world.execute(me);의 코드로 구현한 장면을 직접 재생합니다.">
  <title>world.execute(me); · 웹 장면 재생</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="player.css">
  <script type="module" src="player.js"></script>
</head>
<body>
  <main class="player" id="player" aria-label="코드로 구현한 world.execute(me); 장면">
    <div class="screen" id="screen">
      <iframe id="scene-frame" src="viewer/stage.html" title="코드로 구현한 world.execute(me); 장면" tabindex="-1"></iframe>
      <div class="loading" id="loading" role="status">장면 불러오는 중…</div>
    </div>
    <div class="yt" id="yt" hidden><div id="yt-player"></div></div>
    <div class="bar" id="bar">
      <div class="seek" id="seek">
        <label class="sr-only" for="timeline">재생 위치</label>
        <input id="timeline" type="range" min="0" max="12737" step="1" value="0" disabled aria-valuetext="0:00.000">
        <div class="preview" id="preview" aria-hidden="true" hidden><div class="thumb" id="thumb" hidden></div><output id="hover-time"></output></div>
      </div>
      <fieldset id="controls" disabled>
        <legend class="sr-only">재생 조작</legend>
        <button id="play" class="icon-button" type="button" aria-label="재생" title="재생 / 일시정지 (Space)"><svg viewBox="0 0 20 20" aria-hidden="true"><path id="play-icon" class="solid" d="M6 3.5 16 10 6 16.5Z"/></svg></button>
        <button id="prev-frame" class="icon-button" type="button" aria-label="이전 프레임" title="이전 프레임 (,)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 4v12M15 4l-8 6 8 6Z"/></svg></button>
        <button id="next-frame" class="icon-button" type="button" aria-label="다음 프레임" title="다음 프레임 (.)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M15 4v12M5 4l8 6-8 6Z"/></svg></button>
        <div class="clock">
          <label class="sr-only" for="time-input">시간 이동 (0:16.000 또는 16)</label>
          <input id="time-input" type="text" value="0:00.000" inputmode="decimal" spellcheck="false" autocomplete="off" title="시간을 입력하고 Enter">
          <span class="duration">/ 3:32.300</span>
          <output id="frame-number" for="timeline">프레임 0</output>
        </div>
        <span class="space"></span>
        <div class="picks">
          <output id="scale-note" class="scale-note" hidden></output>
          <label class="pick" title="장면을 그리는 화면 픽셀 수. 고정 해상도는 1:1로 표시합니다."><span>해상도</span><select id="resolution">
            <option value="fit">화면 맞춤</option>
            <option value="3840x2160">3840 × 2160</option>
            <option value="2560x1440">2560 × 1440</option>
            <option value="1920x1080">1920 × 1080</option>
            <option value="1280x720">1280 × 720</option>
            <option value="854x480">854 × 480</option>
            <option value="640x360">640 × 360</option>
          </select></label>
          <label class="pick" title="1초에 장면을 몇 번 계산할지"><span>fps</span><select id="fps">
            <option value="24">24</option>
            <option value="30">30</option>
            <option value="60">60 (원본)</option>
            <option value="120">120</option>
            <option value="144">144</option>
            <option value="240">240</option>
          </select></label>
          <label class="pick"><span>속도</span><select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label>
        </div>
        <button id="youtube" class="icon-button" type="button" aria-label="YouTube 플레이어 숨기기" aria-pressed="true" title="YouTube 플레이어 보이기 / 숨기기 (Y)" hidden><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="4.5" width="15" height="11" rx="3"/><path class="solid" d="M8.5 7.6v4.8l4-2.4Z"/></svg></button>
        <button id="mute" class="icon-button" type="button" aria-label="음소거" aria-pressed="false" title="음소거 (M)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 8h3l4-4v12l-4-4H3ZM13 6c3 2 3 6 0 8M15 3c5 4 5 10 0 14"/><path id="mute-mark" d="M3 17 17 3" display="none"/></svg></button>
        <button id="fullscreen" class="icon-button" type="button" aria-label="전체 화면" title="전체 화면 (F)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 8V3h5M12 3h5v5M17 12v5h-5M8 17H3v-5"/></svg></button>
      </fieldset>
    </div>
    <p class="toast" id="status" role="status" hidden></p>
    <audio id="soundtrack" preload="auto"></audio>
  </main>
</body>
</html>
